server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue retombe sur index.html.
    # Indispensable car React Router gère le routage côté client :
    # sans ça, un rafraîchissement sur /profil renverrait un 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}